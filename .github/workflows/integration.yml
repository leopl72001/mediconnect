name: MediConnect Docker Integration
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar variables de demostracion
        run: cp .env.example .env
      - name: Construir y levantar PostgreSQL, MongoDB, Redis y la API
        run: docker compose up --build -d
      - name: Esperar API y comprobar health
        shell: bash
        run: |
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/actuator/health | grep -q '"status":"UP"'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8081/api/v1/specialties
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color --tail=200 app postgres mongo redis
      - name: Limpiar contenedores
        if: always()
        run: docker compose down -v
